<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CRMZona App | Проверка соединения</title>
  <style>body{max-width:800px;margin:32px auto;padding:0 16px;font:16px/1.5 "Segoe UI",Arial,sans-serif;color:#1d2927;background:#f4f7f6}h1{font-size:24px}table{width:100%;border-collapse:collapse;background:#fff}th,td{text-align:left;padding:10px;border:1px solid #d8e3df;overflow-wrap:anywhere}td:last-child{font-variant-numeric:tabular-nums}a{color:#235b55}button{font:inherit;padding:8px 16px;cursor:pointer}.failed{color:#a32828}.passed{color:#235b55}#context,#previous{overflow-wrap:anywhere}@media(max-width:540px){th,td{padding:6px;font-size:13px}}</style>
</head>
<body>
  <h1>Проверка соединения</h1>
  <p id="context">CRMZona App</p>
  <p id="previous" hidden></p>
  <p><label>Маршрут <select id="transport"><option value="api">Серверный API</option><option value="cdn">Статические файлы</option></select></label></p>
  <p id="status" role="status">Проверка запускается…</p>
  <table>
    <thead><tr><th>Ресурс</th><th>Результат</th><th>Получено</th></tr></thead>
    <tbody id="checks"></tbody>
  </table>
  <p><button id="retry" type="button" disabled>Проверить снова</button> · <a href="/">Вернуться в CRM</a></p>
  <p>Проверяются реальные фрагменты приложения. Доступ к базе и вход проверяются отдельно. Результаты остаются в браузере, пароли и данные сотрудников не отправляются.</p>
  <noscript><p>Включите JavaScript для проверки соединения.</p></noscript>
  <script>
  'use strict';
  (() => {
    const byId = (id) => document.getElementById(id);
    const parts = [["part-0-68c134bc421d.bin",6144,"68c134bc421df3c1c0496da7125b0bb7ab5f60d2bd9af5688fc9ecf86b1de609"],["part-1-1af231fd805b.bin",6144,"1af231fd805bb66013c42ae78947834b12d9f0eb7ea856a56e81818118c25383"],["part-2-2b824d72beb6.bin",6144,"2b824d72beb62a7b0392b56d405cc9b581c0309856e38f68038a3c7af3eb026c"],["part-3-00048d54f0e1.bin",6144,"00048d54f0e103dbf69f4ff81e798c055d131eb8837dfbecf23bc5135bd1d27b"],["part-4-c98fad09b454.bin",6144,"c98fad09b454f773830ab3787b31271cb353298ba97a4cb901f21c72e8b6b925"],["part-5-c12e8ed2f414.bin",6144,"c12e8ed2f414eabd83e1888fd80beb5eb3abbd5c9a3bf7b83cdba1b3339b5c00"],["part-6-83adea6989cb.bin",6144,"83adea6989cbfe99ce51d8840f83fb3335a7f2313245e33a8cdb6fdb7b04ea8f"],["part-7-2c134bffbf32.bin",6144,"2c134bffbf32d10828cbef4ec733b4ffcb67056040ab08a104094bcea78d84ca"],["part-8-53b7490a9915.bin",6144,"53b7490a99158995c46ef316699b1012414459653a9c9f4d2a9a8c8342ff2fb8"],["part-9-944aa590a7c7.bin",6144,"944aa590a7c7622c671527eeee695d76acacd898636582bf8ba5ca32a865697e"],["part-10-30313fbbf39c.bin",6144,"30313fbbf39c6f7de4de4482255fb1cdf8ecee35827074fc217e3cee7b123e57"],["part-11-44a2ad34e57d.bin",6144,"44a2ad34e57d7b31dee04260ab6f5bbfcdfedb09970d306590edf09060b046c7"],["part-12-059cdcfb1b98.bin",6144,"059cdcfb1b9817de1e7c2175c770c5b7a94ca6eab82379b59f530d7b50176c4f"],["part-13-5b002d0eeca4.bin",6144,"5b002d0eeca4c9b66b0fa3500484e18deff4ea16c15e16e478ea0792d9f2716a"],["part-14-d730e960cf68.bin",3275,"d730e960cf6858a05201c032c0bbfeed073545ab0cab17ff2c9cea0762f62aad"]];
    try {
      const previous = sessionStorage.getItem('crm.loadFailure');
      if (previous) { byId('previous').textContent = 'Последний сбой: ' + previous; byId('previous').hidden = false; }
    } catch {}
    async function run() {
      byId('retry').disabled = true;
      const api = byId('transport').value === 'api';
      byId('transport').disabled = true;
      const resources = [['/', 9832, ''], ...parts.map(([name, size, hash]) => [api ? '/api/client-part?name=' + name : '/client-parts/' + name, size, hash])];
      byId('checks').replaceChildren();
      byId('context').textContent = location.host + ' · ' + new Date().toLocaleString('ru-RU');
      byId('status').textContent = 'Проверяем загрузку…';
      let failures = 0;
      for (const [path, size, expected] of resources) {
        const row = document.createElement('tr');
        const cells = [path, 'Проверяем…', '0 / ' + size + ' байт'].map((text) => {
          const cell = document.createElement('td'); cell.textContent = text; row.append(cell); return cell;
        });
        byId('checks').append(row);
        let controller, timer;
        const start = performance.now();
        let offset = 0, http = '';
        try {
          const bytes = new Uint8Array(size), viaApi = api && expected;
          const step = viaApi ? 2048 : size;
          for (let start = 0; start < size; start += step) {
            controller = new AbortController();
            timer = setTimeout(() => controller.abort(), 15000);
            const response = await fetch(path + (viaApi ? '&offset=' + start : ''), { cache: 'no-store', credentials: 'omit', signal: controller.signal });
            http = 'HTTP ' + response.status;
            if (!response.ok) throw new Error(http);
            const reader = response.body.getReader(), end = Math.min(start + step, size);
            while (offset < end) {
              const { value, done } = await reader.read();
              if (done || offset + value.length > end) throw new Error('Неполный или изменённый файл');
              bytes.set(value, offset); offset += value.length;
              cells[2].textContent = offset + ' / ' + size + ' байт';
            }
            controller.abort(); clearTimeout(timer);
          }
          if (expected) {
            const digest = Array.from(new Uint8Array(await crypto.subtle.digest('SHA-256', bytes)), (b) => b.toString(16).padStart(2, '0')).join('');
            if (digest !== expected) throw new Error('CHECKSUM');
          }
          cells[1].textContent = http + ', проверено, ' + ((performance.now() - start) / 1000).toFixed(1) + ' с';
          cells[1].className = 'passed';
        } catch (error) {
          failures++;
          cells[1].className = 'failed';
          cells[1].textContent = (http ? http + ', ' : '') + (error.name === 'AbortError' ? 'не получено за 15 с' : error.message);
        } finally { clearTimeout(timer); controller?.abort(); }
      }
      byId('status').textContent = failures ? 'Ошибок загрузки: ' + failures + '. Отправьте снимок результатов с названием провайдера.' : 'Все фрагменты получены и проверены.';
      byId('retry').disabled = false;
      byId('transport').disabled = false;
    }
    byId('retry').addEventListener('click', run);
    run();
  })();
  </script>
</body>
</html>
